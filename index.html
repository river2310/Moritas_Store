<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Distribuidora - Sistema de Gestión</title>
    
    <!-- 1. Estilos Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. Babel para traducir el código en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- 5. Firebase SDK (Versión Compat para HTML simple) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* Ajustes para móviles */
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        body { background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURACIÓN FIREBASE ---
        // IMPORTANTE: Si usas este archivo fuera de este chat, reemplaza el objeto 'fallbackConfig' 
        // con tus propios datos de Firebase Console.
        const getFirebaseConfig = () => {
            const fallbackConfig = {
                apiKey: "API_KEY_AQUI",
                authDomain: "TU_PROYECTO.firebaseapp.com",
                projectId: "TU_PROYECTO",
                storageBucket: "TU_PROYECTO.appspot.com",
                messagingSenderId: "000000000",
                appId: "1:000000000:web:0000000000"
            };

            // Detección automática para el entorno de previsualización
            if (typeof __firebase_config !== 'undefined') {
                return JSON.parse(__firebase_config);
            }
            return fallbackConfig;
        };

        // Inicializar Firebase
        const firebaseConfig = getFirebaseConfig();
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        // ID de la app para separar datos en entornos compartidos
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'mi-distribuidora-v1';

        const { useState, useEffect } = React;

        // --- ICONOS SVG ---
        const Icon = ({ name, className }) => {
            const icons = {
                Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
                Package: <><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></>,
                FileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
                Plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
                Search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
                Trash2: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
                CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
                Download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
                Home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
                DollarSign: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
                Calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
                Phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
                MapPin: <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>
            };
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width="24" height="24" viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10"/>}
                </svg>
            );
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            
            // Datos
            const [clients, setClients] = useState([]);
            const [orders, setOrders] = useState([]);

            // Formularios
            const [newClient, setNewClient] = useState({ name: '', phone: '', address: '', email: '' });
            const [currentOrder, setCurrentOrder] = useState({
                clientId: '',
                items: [{ id: 1, desc: '', qty: 1, price: 0 }],
                status: 'pendiente',
                date: new Date().toISOString().split('T')[0]
            });
            
            const [notification, setNotification] = useState(null);

            // 1. Autenticación
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) {
                        console.error("Error Auth:", error);
                        // Fallback manual por si falla el token automático
                        if (!auth.currentUser) await auth.signInAnonymously();
                    }
                };

                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    // Solo detenemos el loading si hay usuario, o si ya pasó tiempo (aquí simplificado)
                    // Para evitar el error de render, el loading se quita, pero la UI manejará user null
                    if(u) setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Fetching (Firestore Compat)
            useEffect(() => {
                if (!user) return;

                const clientsRef = db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('clients');
                const ordersRef = db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('orders');

                const unsubClients = clientsRef.onSnapshot(snap => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    data.sort((a, b) => a.name.localeCompare(b.name));
                    setClients(data);
                });

                const unsubOrders = ordersRef.onSnapshot(snap => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    data.sort((a, b) => {
                         const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
                         const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
                         return dateB - dateA;
                    });
                    setOrders(data);
                });

                return () => {
                    unsubClients();
                    unsubOrders();
                };
            }, [user]);

            // Utilidades
            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
            };

            // Lógica Clientes
            const handleAddClient = async (e) => {
                e.preventDefault();
                if (!user) return showNotification("Espere, autenticando...");
                if (!newClient.name) return;
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('clients').add({
                        ...newClient,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewClient({ name: '', phone: '', address: '', email: '' });
                    showNotification("Cliente registrado");
                } catch (err) { console.error(err); showNotification("Error al guardar"); }
            };

            const handleDeleteClient = async (id) => {
                if (!user) return;
                if(!confirm("¿Borrar cliente?")) return;
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('clients').doc(id).delete();
                    showNotification("Cliente eliminado");
                } catch(err) { console.error(err); }
            };

            // Lógica Pedidos
            const updateOrderItem = (index, field, value) => {
                const newItems = [...currentOrder.items];
                newItems[index][field] = value;
                setCurrentOrder({ ...currentOrder, items: newItems });
            };

            const addOrderItem = () => {
                setCurrentOrder({
                    ...currentOrder,
                    items: [...currentOrder.items, { id: Date.now(), desc: '', qty: 1, price: 0 }]
                });
            };

            const removeOrderItem = (index) => {
                if (currentOrder.items.length === 1) return;
                const newItems = currentOrder.items.filter((_, i) => i !== index);
                setCurrentOrder({ ...currentOrder, items: newItems });
            };

            const calculateTotal = (items) => items.reduce((acc, item) => acc + (item.qty * item.price), 0);

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                if (!user) return showNotification("Espere, autenticando...");
                if (!currentOrder.clientId) return showNotification("Selecciona un cliente");
                
                const validItems = currentOrder.items.filter(i => i.desc.trim() !== '');
                if (validItems.length === 0) return showNotification("Agrega productos");

                try {
                    const total = calculateTotal(validItems);
                    const client = clients.find(c => c.id === currentOrder.clientId);

                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('orders').add({
                        clientId: currentOrder.clientId,
                        clientName: client ? client.name : 'Desconocido',
                        items: validItems,
                        total: total,
                        status: currentOrder.status,
                        dateString: currentOrder.date,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    setCurrentOrder({
                        clientId: '',
                        items: [{ id: Date.now(), desc: '', qty: 1, price: 0 }],
                        status: 'pendiente',
                        date: new Date().toISOString().split('T')[0]
                    });
                    setView('history');
                    showNotification("Venta registrada");
                } catch (err) { console.error(err); showNotification("Error al registrar venta"); }
            };

            const toggleOrderStatus = async (order) => {
                if (!user) return;
                try {
                    const newStatus = order.status === 'pendiente' ? 'pagado' : 'pendiente';
                    await db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('orders').doc(order.id).update({
                        status: newStatus
                    });
                    showNotification(`Marcado como ${newStatus}`);
                } catch(err) { console.error(err); }
            };

            const deleteOrder = async (id) => {
                if (!user) return;
                if(!confirm("¿Eliminar venta?")) return;
                await db.collection('artifacts').doc(APP_ID).collection('users').doc(user.uid).collection('orders').doc(id).delete();
            };

            // PDF
            const generatePDF = (order) => {
                if (!window.jspdf) return showNotification("Cargando sistema PDF...");
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const client = clients.find(c => c.id === order.clientId) || { name: order.clientName };

                // Header
                doc.setFontSize(18); doc.text("NOTA DE VENTA", 14, 20);
                doc.setFontSize(10); doc.text(`Fecha: ${order.dateString}`, 14, 28);
                
                // Cliente
                doc.setFontSize(12); doc.text(`Cliente: ${client.name}`, 14, 40);
                if(client.address) doc.text(`Dirección: ${client.address}`, 14, 46);

                // Tabla
                const rows = order.items.map(i => [i.desc, i.qty, formatCurrency(i.price), formatCurrency(i.qty * i.price)]);
                doc.autoTable({
                    head: [['Descripción', 'Cant.', 'Precio', 'Total']],
                    body: rows,
                    startY: 55,
                    theme: 'grid'
                });

                // Total
                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(14);
                doc.text(`TOTAL: ${formatCurrency(order.total)}`, 140, finalY);

                // Estado
                doc.setFontSize(12);
                doc.setTextColor(order.status === 'pagado' ? 'green' : 'red');
                doc.text(order.status.toUpperCase(), 150, 20);

                doc.save(`Venta_${client.name}.pdf`);
            };

            // --- VISTAS ---
            if (loading) return <div className="flex h-screen items-center justify-center">Cargando...</div>;

            return (
                <div className="pb-20 md:pb-0 min-h-screen">
                    {/* Toast */}
                    {notification && (
                        <div className="fixed top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg z-50 animate-bounce">
                            {notification}
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-10">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold flex items-center">
                                <Icon name="Package" className="mr-2 h-6 w-6" /> Mi Negocio
                            </h1>
                            <span className="text-xs bg-indigo-800 px-2 py-1 rounded">Usuario: {user ? user.uid.slice(0,4) : '...'}...</span>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4">
                        {/* VIEW: DASHBOARD */}
                        {view === 'dashboard' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-white p-6 rounded shadow border-l-4 border-blue-500">
                                    <p className="text-gray-500 text-sm">Ventas Totales</p>
                                    <h3 className="text-2xl font-bold">{formatCurrency(orders.reduce((s,o)=>s+o.total,0))}</h3>
                                </div>
                                <div className="bg-white p-6 rounded shadow border-l-4 border-red-500">
                                    <p className="text-gray-500 text-sm">Por Cobrar</p>
                                    <h3 className="text-2xl font-bold text-red-600">
                                        {formatCurrency(orders.filter(o=>o.status==='pendiente').reduce((s,o)=>s+o.total,0))}
                                    </h3>
                                </div>
                                <div className="bg-white p-6 rounded shadow border-l-4 border-green-500">
                                    <p className="text-gray-500 text-sm">Pedidos (Mes)</p>
                                    <h3 className="text-2xl font-bold text-green-600">
                                        {orders.filter(o => new Date(o.dateString).getMonth() === new Date().getMonth()).length}
                                    </h3>
                                </div>
                                <div className="md:col-span-3 grid grid-cols-2 gap-4 mt-2">
                                    <button onClick={()=>setView('new-order')} className="bg-indigo-600 text-white p-4 rounded shadow flex flex-col items-center justify-center hover:bg-indigo-700">
                                        <Icon name="Plus" className="mb-2" /> Nueva Venta
                                    </button>
                                    <button onClick={()=>setView('clients')} className="bg-gray-700 text-white p-4 rounded shadow flex flex-col items-center justify-center hover:bg-gray-800">
                                        <Icon name="Users" className="mb-2" /> Clientes
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* VIEW: CLIENTS */}
                        {view === 'clients' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded shadow">
                                    <h2 className="font-bold mb-3 flex items-center"><Icon name="Users" className="mr-2 h-5 w-5"/> Registrar Cliente</h2>
                                    <form onSubmit={handleAddClient} className="grid gap-3">
                                        <input className="border p-2 rounded" placeholder="Nombre" value={newClient.name} onChange={e=>setNewClient({...newClient, name:e.target.value})} />
                                        <input className="border p-2 rounded" placeholder="Teléfono" value={newClient.phone} onChange={e=>setNewClient({...newClient, phone:e.target.value})} />
                                        <input className="border p-2 rounded" placeholder="Dirección" value={newClient.address} onChange={e=>setNewClient({...newClient, address:e.target.value})} />
                                        <button className="bg-green-600 text-white p-2 rounded">Guardar</button>
                                    </form>
                                </div>
                                <div className="bg-white rounded shadow">
                                    {clients.map(c => (
                                        <div key={c.id} className="p-4 border-b flex justify-between items-center">
                                            <div>
                                                <div className="font-bold">{c.name}</div>
                                                <div className="text-xs text-gray-500">{c.phone} - {c.address}</div>
                                            </div>
                                            <button onClick={()=>handleDeleteClient(c.id)} className="text-red-500"><Icon name="Trash2" className="h-5 w-5"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VIEW: NEW ORDER */}
                        {view === 'new-order' && (
                            <div className="bg-white p-4 rounded shadow">
                                <h2 className="font-bold mb-4 flex items-center"><Icon name="FileText" className="mr-2 h-5 w-5"/> Nueva Venta</h2>
                                <form onSubmit={handleSaveOrder}>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4 bg-gray-50 p-3 rounded">
                                        <select className="border p-2 rounded w-full" value={currentOrder.clientId} onChange={e=>setCurrentOrder({...currentOrder, clientId:e.target.value})}>
                                            <option value="">Seleccionar Cliente</option>
                                            {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                        <input type="date" className="border p-2 rounded w-full" value={currentOrder.date} onChange={e=>setCurrentOrder({...currentOrder, date:e.target.value})} />
                                        <select className="border p-2 rounded w-full" value={currentOrder.status} onChange={e=>setCurrentOrder({...currentOrder, status:e.target.value})}>
                                            <option value="pendiente">Pendiente</option>
                                            <option value="pagado">Pagado</option>
                                        </select>
                                    </div>
                                    <div className="space-y-2 mb-4">
                                        <label className="text-sm font-bold">Productos</label>
                                        {currentOrder.items.map((item, idx) => (
                                            <div key={item.id} className="flex gap-2">
                                                <input className="border p-2 rounded flex-grow" placeholder="Descripción" value={item.desc} onChange={e=>updateOrderItem(idx, 'desc', e.target.value)} />
                                                <input type="number" className="border p-2 rounded w-16 text-center" placeholder="#" value={item.qty} onChange={e=>updateOrderItem(idx, 'qty', +e.target.value)} />
                                                <input type="number" className="border p-2 rounded w-20 text-right" placeholder="$" value={item.price} onChange={e=>updateOrderItem(idx, 'price', +e.target.value)} />
                                                <button type="button" onClick={()=>removeOrderItem(idx)} className="text-red-500"><Icon name="Trash2" className="h-5 w-5"/></button>
                                            </div>
                                        ))}
                                        <button type="button" onClick={addOrderItem} className="text-indigo-600 text-sm font-bold flex items-center mt-2">
                                            <Icon name="Plus" className="h-4 w-4 mr-1"/> Agregar Producto
                                        </button>
                                    </div>
                                    <div className="flex justify-between items-center border-t pt-4">
                                        <div className="text-xl font-bold">Total: {formatCurrency(calculateTotal(currentOrder.items))}</div>
                                        <button className="bg-indigo-600 text-white px-6 py-2 rounded shadow">Finalizar</button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* VIEW: HISTORY */}
                        {view === 'history' && (
                            <div className="space-y-4">
                                <div className="bg-white p-2 rounded shadow flex gap-2">
                                    <Icon name="Search" className="text-gray-400 m-2"/>
                                    <input placeholder="Buscar venta..." className="w-full outline-none" />
                                </div>
                                <div className="bg-white rounded shadow overflow-hidden">
                                    {orders.length === 0 && <div className="p-4 text-center text-gray-500">Sin ventas registradas</div>}
                                    {orders.map(order => (
                                        <div key={order.id} className="p-4 border-b hover:bg-gray-50">
                                            <div className="flex justify-between mb-2">
                                                <span className="font-bold text-gray-800">{order.clientName}</span>
                                                <span className="text-sm text-gray-500">{order.dateString}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <div className="text-sm">
                                                    <div className="font-bold text-gray-900">{formatCurrency(order.total)}</div>
                                                    <span className="text-xs text-gray-500">{order.items.length} productos</span>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={()=>toggleOrderStatus(order)} className={`px-2 py-1 rounded text-xs font-bold border ${order.status === 'pagado' ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-100 text-red-800 border-red-200'}`}>
                                                        {order.status.toUpperCase()}
                                                    </button>
                                                    <button onClick={()=>generatePDF(order)} className="p-1 text-blue-600 border rounded hover:bg-blue-50">
                                                        <Icon name="Download" className="h-5 w-5"/>
                                                    </button>
                                                    <button onClick={()=>deleteOrder(order.id)} className="p-1 text-gray-400 border rounded hover:text-red-600">
                                                        <Icon name="Trash2" className="h-5 w-5"/>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navbar Mobile */}
                    <nav className="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around p-2 z-40 safe-area-bottom">
                        <button onClick={()=>setView('dashboard')} className={`flex flex-col items-center ${view==='dashboard'?'text-indigo-600':'text-gray-400'}`}>
                            <Icon name="Home" className="h-6 w-6"/> <span className="text-[10px]">Inicio</span>
                        </button>
                        <button onClick={()=>setView('clients')} className={`flex flex-col items-center ${view==='clients'?'text-indigo-600':'text-gray-400'}`}>
                            <Icon name="Users" className="h-6 w-6"/> <span className="text-[10px]">Clientes</span>
                        </button>
                        <button onClick={()=>setView('new-order')} className="bg-indigo-600 text-white rounded-full p-3 -mt-6 shadow-lg border-4 border-gray-100">
                            <Icon name="Plus" className="h-6 w-6"/>
                        </button>
                        <button onClick={()=>setView('history')} className={`flex flex-col items-center ${view==='history'?'text-indigo-600':'text-gray-400'}`}>
                            <Icon name="FileText" className="h-6 w-6"/> <span className="text-[10px]">Historial</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
