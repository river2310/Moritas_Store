<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades Moritas - Control de Accesos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Html5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Firebase SDK Setup -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f3ff; color: #1f2937; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation-duration: 300ms; animation-fill-mode: both; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation-name: fadeIn; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .slide-in { animation-name: slideIn; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot } from 'firebase/firestore';

        // =========================================================================
        // CONFIGURACIÓN DE FIREBASE (Pega tus valores aquí)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAd6KaqlpsYIKBFD1GYVfR22_G7ukbdNp0",
            authDomain: "novedades-moritas.firebaseapp.com",
            projectId: "novedades-moritas",
            storageBucket: "novedades-moritas.firebasestorage.app",
            messagingSenderId: "807850971258",
            appId: "1:807850971258:web:8faead557ca2bdc2532bc3",
            measurementId: "G-47E370P5CM"
        };
        // =========================================================================

        const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyAd6KaqlpsYIKBFD1GYVfR22_G7ukbdNp0";
        const app = isConfigured ? initializeApp(firebaseConfig) : null;
        const auth = isConfigured ? getAuth(app) : null;
        const db = isConfigured ? getFirestore(app) : null;
        const appId = 'novedades-moritas-pro';

        const { useState, useEffect, useRef } = React;

        // Componente de Icono
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block align-middle ${className}`}></i>;
        };

        // --- NAVEGACIÓN ---
        const Navbar = ({ view, setView, currentUser, setCurrentUser }) => (
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-2 z-40 md:relative md:border-t-0 md:flex-col md:w-64 md:h-screen md:justify-start md:space-y-2 md:p-4 text-gray-800 font-medium shadow-2xl md:shadow-none">
                <div className="hidden md:block mb-8 px-4">
                    <h2 className="text-xl font-black text-purple-600 leading-tight">Novedades<br/>Moritas</h2>
                    <p className="text-xs text-gray-400 mt-1 font-bold flex items-center">
                        <Icon name="user" size={12} className="mr-1 text-purple-500"/> {currentUser?.name?.split(' ')[0]}
                    </p>
                </div>
                {[
                    { id: 'dashboard', icon: 'layout-dashboard', label: 'Inicio', roles: ['admin', 'vendedor'] },
                    { id: 'sales', icon: 'barcode', label: 'Vender', roles: ['admin', 'vendedor'] },
                    { id: 'inventory', icon: 'package', label: 'Inventario', roles: ['admin', 'vendedor'] },
                    { id: 'customers', icon: 'users', label: 'Clientes', roles: ['admin'] },
                    { id: 'users_admin', icon: 'user-plus', label: 'Usuarios', roles: ['admin'] },
                    { id: 'reports', icon: 'bar-chart-3', label: 'Reportes', roles: ['admin'] },
                ].map(item => (item.roles.includes(currentUser?.role)) && (
                    <button key={item.id} onClick={() => setView(item.id)}
                        className={`flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl transition-all ${view === item.id ? 'text-purple-600 bg-purple-50' : 'text-gray-400 hover:bg-gray-50'}`}>
                        <Icon name={item.icon} size={24} />
                        <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">{item.label}</span>
                    </button>
                ))}
                <button onClick={() => { setView('login'); setCurrentUser(null); }}
                    className="flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl text-red-500 hover:bg-red-50">
                    <Icon name="log-out" size={24} />
                    <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">Salir</span>
                </button>
            </nav>
        );

        // --- GESTIÓN DE USUARIOS ---
        const UsersAdminView = ({ users }) => {
            const [isAdding, setIsAdding] = useState(false);
            const [form, setForm] = useState({ name: '', username: '', pin: '', role: 'vendedor' });

            const save = async () => {
                if (!form.name || !form.username || !form.pin) return alert('Por favor, llena todos los campos.');
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'), form);
                    setIsAdding(false);
                    setForm({ name: '', username: '', pin: '', role: 'vendedor' });
                    alert("Usuario creado exitosamente");
                } catch (e) { alert("Error al conectar con la base de datos."); }
            };

            const remove = async (id) => {
                if (confirm('¿Estás seguro de eliminar este acceso?')) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id));
                }
            };

            return (
                <div className="p-4 space-y-6 pb-24 animate-in fade-in">
                    <header className="flex justify-between items-center">
                        <h2 className="text-2xl font-black text-gray-800">Usuarios del Sistema</h2>
                        {!isAdding && (
                            <button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg">
                                <Icon name="plus" size={20} className="mr-1" /> Nuevo Acceso
                            </button>
                        )}
                    </header>

                    {isAdding && (
                        <div className="bg-white p-7 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-4 slide-in">
                            <div className="flex justify-between font-black text-purple-700">
                                <h3>Registrar nuevo colaborador</h3>
                                <button onClick={() => setIsAdding(false)}><Icon name="x" /></button>
                            </div>
                            <input placeholder="Nombre Completo" className="w-full p-4 border-2 border-gray-100 rounded-2xl font-bold focus:border-purple-300 outline-none" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            <input placeholder="Nombre de Usuario (Login)" className="w-full p-4 border-2 border-gray-100 rounded-2xl font-bold focus:border-purple-300 outline-none" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
                            <div className="grid grid-cols-2 gap-3">
                                <div className="relative">
                                    <Icon name="key-round" size={16} className="absolute left-4 top-5 text-gray-300" />
                                    <input type="password" placeholder="PIN" className="w-full pl-10 p-4 border-2 border-gray-100 rounded-2xl font-black text-center tracking-widest" value={form.pin} onChange={e => setForm({...form, pin: e.target.value})} maxLength={8}/>
                                </div>
                                <select className="p-4 border-2 border-gray-100 rounded-2xl bg-white font-black text-gray-800" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                                    <option value="vendedor">Vendedor</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <button onClick={save} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl shadow-lg mt-2 uppercase tracking-widest active:scale-95 transition">Habilitar Acceso</button>
                        </div>
                    )}

                    <div className="grid gap-3">
                        {users.map(u => (
                            <div key={u.id} className="bg-white p-5 rounded-[2rem] border border-purple-50 flex justify-between items-center shadow-sm">
                                <div className="flex items-center space-x-4">
                                    <div className={`p-3 rounded-2xl shadow-inner ${u.role === 'admin' ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600'}`}>
                                        <Icon name="user-circle" size={32}/>
                                    </div>
                                    <div>
                                        <p className="font-black text-gray-800 text-base leading-tight">{u.name}</p>
                                        <p className="text-[10px] text-gray-400 font-black uppercase tracking-widest">{u.role} • @{u.username}</p>
                                    </div>
                                </div>
                                {u.id !== '1' && u.id !== '2' && (
                                    <button onClick={() => remove(u.id)} className="text-red-300 p-2 hover:bg-red-50 rounded-xl transition">
                                        <Icon name="trash-2" size={20} />
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL ---
        const App = () => {
            const [view, setView] = useState('login');
            const [fbUser, setFbUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            
            const [users, setUsers] = useState([]);
            const [products, setProducts] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [sales, setSales] = useState([]);
            const [cart, setCart] = useState([]);
            const [categories] = useState([{id:1, name:'Perfumería'}, {id:2, name:'Papelería'}, {id:3, name:'Dulcería'}, {id:4, name:'Novedades'}, {id:5, name:'Stanhome'}, {id:6, name:'Betterware'}, {id:7, name:'Fuller'}]);

            // Autenticación
            useEffect(() => {
                if (!isConfigured) return;
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, u => { if(u) setFbUser(u); });
            }, []);

            // Escuchar Datos
            useEffect(() => {
                if (!fbUser || !db) return;
                const unsubU = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), s => {
                    const cloud = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    setUsers([
                        { id: '1', username: 'admin', pin: '1234', role: 'admin', name: 'Administrador' },
                        { id: '2', username: 'fer', pin: '2310', role: 'admin', name: 'Fernando Montoya Rivera' },
                        ...cloud
                    ]);
                });
                const unsubP = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), s => setProducts(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubC = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), s => setCustomers(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubS = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), s => setSales(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubU(); unsubP(); unsubC(); unsubS(); };
            }, [fbUser]);

            const handleLogin = (u, p) => {
                const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pin === p);
                if (found) { setCurrentUser(found); setView('dashboard'); }
                else alert('PIN o Usuario incorrecto');
            };

            if (!isConfigured) return (
                <div className="min-h-screen flex items-center justify-center p-10 text-center bg-purple-700 text-white">
                    <div className="space-y-6 max-w-sm">
                        <Icon name="alert-circle" size={80} />
                        <h1 className="text-3xl font-black italic">Configuración Requerida</h1>
                        <p className="font-bold opacity-80">Fernando, por favor pega tus credenciales de Firebase en la sección `firebaseConfig` del código para activar el sistema.</p>
                    </div>
                </div>
            );

            if (view === 'login') return (
                <div className="min-h-screen bg-gradient-to-br from-purple-800 to-indigo-900 flex items-center justify-center p-6">
                    <div className="bg-white/95 backdrop-blur-md w-full max-w-sm rounded-[3.5rem] p-12 shadow-2xl animate-in fade-in">
                        <div className="flex justify-center mb-10"><div className="bg-purple-100 p-6 rounded-[2rem] text-purple-600"><Icon name="sparkles" size={48} /></div></div>
                        <h1 className="text-3xl font-black text-center mb-2 tracking-tighter uppercase text-gray-800">Moritas POS</h1>
                        <div className="space-y-4 mt-8">
                            <input id="u" placeholder="Usuario" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-3xl outline-none font-black focus:border-purple-200" />
                            <input id="p" type="password" placeholder="PIN de acceso" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-3xl outline-none text-center text-4xl font-black tracking-widest focus:border-purple-200" maxLength={8} />
                            <button onClick={() => handleLogin(document.getElementById('u').value, document.getElementById('p').value)} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-purple-700 active:scale-95 transition-all text-lg uppercase tracking-widest mt-4">Entrar</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-purple-50 md:flex font-sans text-gray-800">
                    <Navbar view={view} setView={setView} currentUser={currentUser} setCurrentUser={setCurrentUser} />
                    <main className="flex-1 max-w-4xl mx-auto md:p-6 bg-purple-50/50 overflow-y-auto">
                        {view === 'dashboard' && (
                            <div className="p-6 space-y-8 animate-in fade-in text-gray-800">
                                <h1 className="text-4xl font-black tracking-tight">Panel Principal</h1>
                                <div className="grid grid-cols-2 gap-5 text-gray-800">
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-purple-600 shadow-sm"><p className="text-[10px] font-black text-gray-400 uppercase">Productos</p><p className="text-5xl font-black text-purple-600">{products.length}</p></div>
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-indigo-500 shadow-sm"><p className="text-[10px] font-black text-gray-400 uppercase">Ventas Hoy</p><p className="text-5xl font-black text-indigo-600">{sales.filter(s => s.date === new Date().toISOString().split('T')[0]).length}</p></div>
                                </div>
                                <button onClick={() => setView('sales')} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-12 rounded-[4rem] flex items-center justify-between shadow-2xl active:scale-95 transition">
                                    <div className="text-left font-black leading-none uppercase text-white"><p className="text-xl opacity-80 mb-1">Nueva</p><p className="text-5xl italic">VENTA</p></div>
                                    <Icon name="barcode" size={80} className="opacity-90" />
                                </button>
                            </div>
                        )}
                        {view === 'users_admin' && <UsersAdminView users={users} />}
                        {/* El resto de las vistas se mantienen integradas... */}
                        {view === 'inventory' && <InventoryView products={products} categories={categories} openScanner={() => {}} />}
                        {view === 'customers' && <CustomersView customers={customers} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
