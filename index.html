<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades Moritas - Punto de Venta Cloud</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Html5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Firebase SDK Setup -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f5f3ff; -webkit-tap-highlight-color: transparent; color: #1f2937; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation-duration: 300ms; animation-fill-mode: both; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation-name: fadeIn; }
        @keyframes slideInFromBottom { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .slide-in-from-bottom { animation-name: slideInFromBottom; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from 'firebase/firestore';

        // =========================================================================
        // PASO 2: PEGA TUS VALORES DE FIREBASE AQUÍ ABAJO
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAd6KaqlpsYIKBFD1GYVfR22_G7ukbdNp0",
            authDomain: "novedades-moritas.firebaseapp.com",
            projectId: "novedades-moritas",
            storageBucket: "novedades-moritas.firebasestorage.app",
            messagingSenderId: "807850971258",
            appId: "1:807850971258:web:8faead557ca2bdc2532bc3",
            measurementId: "G-47E370P5CM"
        };
        // =========================================================================

        // Inicialización de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'novedades-moritas-pro';

        const { useState, useEffect, useRef } = React;

        // Componente de Icono compatible
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => { if (window.lucide) { window.lucide.createIcons(); } }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block align-middle ${className}`} ref={iconRef}></i>;
        };

        // --- COMPONENTES ---

        const Navbar = ({ view, setView, currentUser, setCurrentUser }) => (
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-2 z-40 md:relative md:border-t-0 md:flex-col md:w-64 md:h-screen md:justify-start md:space-y-2 md:p-4 text-gray-800 font-medium shadow-2xl md:shadow-none">
                <div className="hidden md:block mb-8 px-4 text-gray-800">
                    <h2 className="text-xl font-black text-purple-600 leading-tight">Novedades<br/>Moritas</h2>
                    <p className="text-xs text-gray-500 mt-1 font-semibold flex items-center">
                        <Icon name="shield-check" size={14} className="mr-1 text-purple-500"/> {currentUser?.name?.split(' ')[0] || 'Admin'}
                    </p>
                </div>
                {[
                    { id: 'dashboard', icon: 'layout-dashboard', label: 'Inicio', roles: ['admin', 'vendedor'] },
                    { id: 'sales', icon: 'barcode', label: 'Vender', roles: ['admin', 'vendedor'] },
                    { id: 'inventory', icon: 'package', label: 'Inventario', roles: ['admin', 'vendedor'] },
                    { id: 'customers', icon: 'users', label: 'Clientes', roles: ['admin'] },
                    { id: 'users_admin', icon: 'user-plus', label: 'Usuarios', roles: ['admin'] },
                    { id: 'reports', icon: 'bar-chart-3', label: 'Reportes', roles: ['admin'] },
                ].map(item => (item.roles.includes(currentUser?.role)) && (
                    <button key={item.id} onClick={() => setView(item.id)}
                        className={`flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl transition-all duration-200 ${view === item.id ? 'text-purple-600 bg-purple-50' : 'text-gray-400 hover:bg-gray-50'}`}>
                        <Icon name={item.icon} size={24} />
                        <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">{item.label}</span>
                    </button>
                ))}
                <button onClick={() => { setView('login'); setCurrentUser(null); }}
                    className="flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl text-red-500 hover:bg-red-50">
                    <Icon name="log-out" size={24} />
                    <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">Salir</span>
                </button>
            </nav>
        );

        const InventoryView = ({ products, categories, openScanner }) => {
            const [isAdding, setIsAdding] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [activeCategoryId, setActiveCategoryId] = useState(null);
            const initialForm = { barcode: '', name: '', brand: '', categoryId: '', stock: '', cost: '', price: '', costo_factura: '', costo_oferta: '', costo_regalo: '', precio_especial: '', precio_oferta: '', precio_factura: '' };
            const [form, setForm] = useState(initialForm);

            useEffect(() => { if (!activeCategoryId && categories.length > 0) setActiveCategoryId(categories[0].id); }, [categories]);

            const saveProduct = async () => {
                if (!form.name || !form.price) return alert('Campos obligatorios: Nombre y Precio');
                const pData = { 
                    ...form, 
                    cost: parseFloat(form.cost)||0, price: parseFloat(form.price)||0, stock: parseInt(form.stock)||0, 
                    categoryId: parseInt(form.categoryId)||0, costo_factura: parseFloat(form.costo_factura)||0,
                    costo_oferta: parseFloat(form.costo_oferta)||0, costo_regalo: parseFloat(form.costo_regalo)||0,
                    precio_especial: parseFloat(form.precio_especial)||0, precio_oferta: parseFloat(form.precio_oferta)||0,
                    precio_factura: parseFloat(form.precio_factura)||0
                };
                try {
                    if (editingId) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', editingId), pData);
                    else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), pData);
                    setIsAdding(false); setEditingId(null); setForm(initialForm);
                } catch (e) { alert("Error al guardar"); }
            };

            const handleEdit = (p) => { setForm({ ...p }); setEditingId(p.id); setIsAdding(true); };
            const filtered = products.filter(p => parseInt(p.categoryId) === activeCategoryId);
            const isStanhome = parseInt(form.categoryId) === 5;

            return (
                <div className="p-4 space-y-6 pb-24 animate-in fade-in">
                    <header className="flex justify-between items-center text-gray-800">
                        <h2 className="text-2xl font-black">Inventario</h2>
                        {!isAdding && <button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg"><Icon name="plus" size={20} className="mr-1" /> Nuevo</button>}
                    </header>

                    {isAdding && (
                        <div className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-5 animate-in slide-in-from-bottom">
                            <div className="flex justify-between font-black text-purple-700"><h3>Registro de Producto</h3> <button onClick={() => setIsAdding(false)}><Icon name="x" /></button></div>
                            <div className="flex space-x-2">
                                <input placeholder="Código de Barras" className="flex-1 p-4 border-2 border-gray-100 rounded-2xl outline-none" value={form.barcode} onChange={e => setForm({...form, barcode: e.target.value})} />
                                <button onClick={() => openScanner(c => setForm(f => ({...f, barcode: c})))} className="bg-purple-100 text-purple-600 p-4 rounded-2xl"><Icon name="camera" /></button>
                            </div>
                            <input placeholder="Nombre del Producto" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none font-bold" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            <div className="grid grid-cols-2 gap-3">
                                <input placeholder="Marca" className="p-4 border-2 border-gray-100 rounded-2xl outline-none font-bold" value={form.brand} onChange={e => setForm({...form, brand: e.target.value})} />
                                <select className="w-full p-4 border-2 border-gray-100 rounded-2xl bg-white font-bold" value={form.categoryId} onChange={e => setForm({...form, categoryId: e.target.value})}>
                                    <option value="">Categoría...</option>
                                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div className="p-4 bg-gray-50 rounded-2xl border space-y-3">
                                <p className="text-[10px] font-black text-gray-400 uppercase">Costos Factura/Oferta/Regalo</p>
                                <div className="grid grid-cols-3 gap-2">
                                    <input type="number" placeholder="Fac" className="p-2 border rounded-lg" value={form.costo_factura} onChange={e => setForm({...form, costo_factura: e.target.value})} />
                                    <input type="number" placeholder="Ofe" className="p-2 border rounded-lg" value={form.costo_oferta} onChange={e => setForm({...form, costo_oferta: e.target.value})} />
                                    <input type="number" placeholder="Reg" className="p-2 border rounded-lg" value={form.costo_regalo} onChange={e => setForm({...form, costo_regalo: e.target.value})} />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3 text-[10px] text-gray-400 font-black text-center">
                                <div><label>COSTO PROM</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} /></div>
                                <div><label>PRECIO VENTA</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.price} onChange={e => setForm({...form, price: e.target.value})} /></div>
                                <div><label>STOCK</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} /></div>
                            </div>
                            {isStanhome && (
                                <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100 space-y-3">
                                    <p className="text-[10px] font-black text-blue-400 uppercase">Precios Stanhome (Esp/Ofe/Fac)</p>
                                    <div className="grid grid-cols-3 gap-2">
                                        <input type="number" placeholder="Esp" className="p-2 border rounded-lg bg-white" value={form.precio_especial} onChange={e => setForm({...form, precio_especial: e.target.value})} />
                                        <input type="number" placeholder="Ofe" className="p-2 border rounded-lg bg-white" value={form.precio_oferta} onChange={e => setForm({...form, precio_oferta: e.target.value})} />
                                        <input type="number" placeholder="Fac" className="p-2 border rounded-lg bg-white" value={form.precio_factura} onChange={e => setForm({...form, precio_factura: e.target.value})} />
                                    </div>
                                </div>
                            )}
                            <button onClick={saveProduct} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest active:scale-95 transition">Guardar</button>
                        </div>
                    )}

                    {!isAdding && (
                        <div className="space-y-4">
                            <div className="flex space-x-2 overflow-x-auto pb-4 no-scrollbar">
                                {categories.map(cat => (
                                    <button key={cat.id} onClick={() => setActiveCategoryId(cat.id)} className={`px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest whitespace-nowrap border-2 transition-all ${activeCategoryId === cat.id ? 'bg-purple-600 border-purple-600 text-white shadow-lg' : 'bg-white border-gray-100 text-gray-400'}`}>{cat.name}</button>
                                ))}
                            </div>
                            <div className="space-y-2">
                                {filtered.map(p => (
                                    <div key={p.id} className="bg-white p-5 rounded-[2rem] border border-gray-100 flex justify-between items-center shadow-sm">
                                        <div className="flex-1 min-w-0">
                                            <div className="flex items-center space-x-2">
                                                <p className="font-black text-gray-800 text-base">{p.name}</p>
                                                {parseInt(p.categoryId) === 5 && <span className="bg-blue-100 text-blue-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Stanhome</span>}
                                            </div>
                                            <p className="text-xs text-gray-400 font-bold uppercase mt-0.5">{p.barcode || 'S/C'} • {p.brand}</p>
                                            <div className="mt-3 flex space-x-4 text-xs font-black">
                                                <span className="text-purple-600">Venta: ${p.price.toFixed(2)}</span>
                                                <span className={`${p.stock < 5 ? 'text-red-500' : 'text-gray-400'}`}>Stock: {p.stock}</span>
                                            </div>
                                        </div>
                                        <div className="flex space-x-2">
                                            <button onClick={() => handleEdit(p)} className="text-purple-400 p-2.5 bg-purple-50 rounded-2xl"><Icon name="edit" size={20}/></button>
                                            <button onClick={async () => { if(confirm('¿Borrar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', p.id)) }} className="text-red-200 p-2.5 bg-red-50 rounded-2xl"><Icon name="trash-2" size={20}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomersView = ({ customers }) => {
            const [selected, setSelected] = useState(null);
            const [isAdding, setIsAdding] = useState(false);
            const initialForm = { firstName: '', lastName1: '', lastName2: '', phoneCel: '', municipio: '', colonia: '', calle: '', numExt: '', cp: '' };
            const [newCust, setNewCust] = useState(initialForm);

            const saveCustomer = async () => {
                if(!newCust.firstName || !newCust.lastName1) return alert('Nombre y Apellido requeridos');
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), { ...newCust, layaways: [] });
                    setIsAdding(false); setNewCust(initialForm);
                } catch (e) { alert("Error"); }
            };

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800 animate-in fade-in">
                    <header className="flex justify-between items-center text-gray-800">
                        <h2 className="text-2xl font-black text-gray-800">Clientes</h2>
                        {!isAdding && !selected && <button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg"><Icon name="plus" size={20} className="mr-1" /> Nuevo</button>}
                    </header>

                    {isAdding && (
                        <div className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-5 animate-in slide-in-from-bottom">
                            <input placeholder="Nombre" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none font-bold" value={newCust.firstName} onChange={e => setNewCust({...newCust, firstName: e.target.value})} />
                            <div className="grid grid-cols-2 gap-2 text-gray-800">
                                <input placeholder="Ap. Paterno" className="p-4 border-2 border-gray-100 rounded-2xl font-bold" value={newCust.lastName1} onChange={e => setNewCust({...newCust, lastName1: e.target.value})} />
                                <input placeholder="Celular" className="p-4 border-2 border-gray-100 rounded-2xl font-bold" value={newCust.phoneCel} onChange={e => setNewCust({...newCust, phoneCel: e.target.value})} />
                            </div>
                            <button onClick={saveCustomer} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest text-lg">Guardar</button>
                            <button onClick={() => setIsAdding(false)} className="w-full text-gray-400 font-bold uppercase text-xs">Cancelar</button>
                        </div>
                    )}

                    {!isAdding && !selected && (
                        <div className="space-y-2 text-gray-800">
                            {customers.map(c => (
                                <div key={c.id} className="bg-white p-5 rounded-[2rem] border border-purple-50 flex justify-between items-center shadow-sm">
                                    <div className="flex items-center space-x-4">
                                        <div className="bg-purple-100 p-2 rounded-2xl text-purple-600"><Icon name="user" size={24} /></div>
                                        <div><p className="font-black text-gray-800 text-base">{c.firstName} {c.lastName1}</p><p className="text-[10px] text-gray-400 font-black uppercase">{c.phoneCel || 'SIN CELULAR'}</p></div>
                                    </div>
                                    <button onClick={async () => { if(confirm('¿Borrar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'customers', c.id)) }} className="p-2 text-red-200"><Icon name="trash-2" size={18}/></button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const ReportsView = ({ sales, products }) => {
            const [showDetail, setShowDetail] = useState(false);
            const today = new Date().toISOString().split('T')[0];
            const todaysSales = sales.filter(s => s.date === today);
            const totalVentas = todaysSales.reduce((acc, s) => acc + s.total, 0);
            const totalProfit = todaysSales.reduce((acc, s) => acc + s.profit, 0);

            const productDesglose = todaysSales.reduce((acc, sale) => {
                (sale.items || []).forEach(item => {
                    const key = item.id;
                    if (!acc[key]) acc[key] = { name: item.name, qty: 0, price: item.price || 0, profit: 0 };
                    acc[key].qty += item.quantity;
                    acc[key].profit += (item.price - item.cost) * item.quantity;
                });
                return acc;
            }, {});

            if (showDetail) return (
                <div className="p-4 space-y-6 pb-24 animate-in slide-in-from-right text-gray-800">
                    <header className="flex items-center space-x-3 mb-4 text-gray-800"><button onClick={() => setShowDetail(false)} className="p-3 bg-purple-100 text-purple-600 rounded-2xl active:scale-90 transition"><Icon name="chevron-left" size={24}/></button><div><h2 className="text-2xl font-black">Cierre de Hoy</h2></div></header>
                    <div className="bg-white rounded-[2.5rem] border shadow-xl overflow-hidden">
                        <table className="w-full text-left text-gray-800">
                            <thead className="bg-purple-600 text-white text-[9px] font-black uppercase tracking-widest">
                                <tr><th className="p-5">Producto</th><th className="text-center">Cant.</th><th className="text-right">Venta</th><th className="text-right">Ganancia</th></tr>
                            </thead>
                            <tbody className="text-[11px] font-semibold text-gray-800">
                                {Object.values(productDesglose).map((p, idx) => (
                                    <tr key={idx} className="border-b last:border-0 hover:bg-gray-50 transition-colors"><td className="p-5 font-black">{p.name}</td><td className="text-center font-black text-gray-400">{p.qty}</td><td className="text-right font-black text-purple-600">${(p.price * p.qty).toFixed(2)}</td><td className="text-right font-black text-green-600">+${p.profit.toFixed(2)}</td></tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800">
                    <h2 className="text-2xl font-black flex items-center"><Icon name="bar-chart-3" className="mr-2 text-purple-600" /> Reportes de ventas</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-gray-800">
                        <button onClick={() => setShowDetail(true)} className="bg-purple-600 text-white p-7 rounded-[2.5rem] shadow-xl relative overflow-hidden text-left transition hover:scale-[1.02] active:scale-95 text-gray-800 text-gray-800">
                            <Icon name="dollar-sign" size={100} className="absolute -right-4 -bottom-4 opacity-10" />
                            <p className="text-purple-100 font-black text-xs uppercase tracking-widest">Ingresos Hoy</p>
                            <h3 className="text-4xl font-black mt-2">${totalVentas.toFixed(2)}</h3>
                            <p className="text-[10px] mt-2 font-bold uppercase text-purple-200 underline">Toca para ver desglose</p>
                        </button>
                        <div className="bg-indigo-500 text-white p-7 rounded-[2.5rem] shadow-xl relative overflow-hidden text-gray-800">
                            <Icon name="sparkles" size={100} className="absolute -right-4 -bottom-4 opacity-10" />
                            <p className="text-indigo-100 font-black text-xs uppercase tracking-widest text-gray-800 text-gray-800">Ganancia Neta</p>
                            <h3 className="text-4xl font-black mt-2 text-white">${totalProfit.toFixed(2)}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const UsersAdminView = ({ users }) => {
            const [isAdding, setIsAdding] = useState(false);
            const [form, setForm] = useState({ name: '', username: '', pin: '', role: 'vendedor' });
            const save = async () => { 
                if (!form.name || !form.username || !form.pin) return alert('Faltan datos'); 
                try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'), form); setIsAdding(false); setForm({ name: '', username: '', pin: '', role: 'vendedor' }); } catch (e) { alert("Error"); }
            };

            return (
                <div className="p-4 space-y-4 pb-24 text-gray-800 text-sm animate-in fade-in">
                    <header className="flex justify-between items-center text-base font-black text-gray-800"><h2 className="text-2xl font-black">Equipo</h2><button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg active:scale-95 transition"><Icon name="plus" size={20} className="mr-1" /> Nuevo</button></header>
                    {isAdding && (<div className="bg-white p-7 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-4 animate-in zoom-in text-gray-800"><div className="flex justify-between font-bold text-purple-700 text-base"><h3>Registro de Acceso</h3> <button onClick={() => setIsAdding(false)}><Icon name="x"/></button></div><input placeholder="Nombre" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none font-bold" value={form.name} onChange={e => setForm({...form, name: e.target.value})} /><input placeholder="Usuario" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none font-bold" value={form.username} onChange={e => setForm({...form, username: e.target.value})} /><div className="grid grid-cols-2 gap-2 text-gray-800"><input type="password" placeholder="PIN" className="p-4 border-2 border-gray-100 rounded-2xl font-black text-center tracking-widest text-gray-800" value={form.pin} onChange={e => setForm({...form, pin: e.target.value})} maxLength={8}/><select className="p-4 border-2 border-gray-100 rounded-2xl bg-white font-black" value={form.role} onChange={e => setForm({...form, role: e.target.value})}><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></div><button onClick={save} className="w-full bg-purple-600 text-white font-black py-5 rounded-2xl shadow-lg mt-2 uppercase tracking-widest active:scale-95 transition text-gray-800 text-gray-800">Guardar</button></div>)}
                    <div className="grid gap-2 text-gray-800">{users.map(u => (<div key={u.id} className="bg-white p-5 rounded-[2rem] border border-purple-50 flex justify-between items-center shadow-sm hover:border-purple-200 transition-colors text-gray-800 text-gray-800"><div className="flex items-center space-x-4"><div className={`p-3 rounded-2xl shadow-inner ${u.role === 'admin' ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600'}`}><Icon name="user" size={32}/></div><div><p className="font-black text-gray-800 text-base leading-tight">{u.name}</p><p className="text-[10px] text-gray-400 font-black uppercase tracking-widest">{u.role} • @{u.username}</p></div></div><button onClick={async () => { if(confirm('¿Borrar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u.id)) }} className="text-red-300 p-2"><Icon name="trash-2" size={18} /></button></div>))}</div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [fbUser, setFbUser] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const scannerCallbackRef = useRef(null);

            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [users, setUsers] = useState([]);
            const [cart, setCart] = useState([]);

            // 1. Autenticación (Regla 3: Auth primero)
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const res = await signInAnonymously(auth);
                        setFbUser(res.user);
                    } catch (e) { console.error("Firebase Auth Error:", e); }
                };
                initAuth();
            }, []);

            // 2. Escuchar Firestore (Reglas 1 y 2: Solo después de Auth)
            useEffect(() => {
                if (!fbUser || !db) return;

                const unsubP = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), s => setProducts(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubC = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), s => setCustomers(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubS = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), s => setSales(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubCat = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), s => setCategories(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubU = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), s => {
                    const cloud = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    setUsers([
                        { id: '1', username: 'admin', pin: '1234', role: 'admin', name: 'Administrador' },
                        { id: '2', username: 'fer', pin: '2310', role: 'admin', name: 'Fernando Montoya Rivera' },
                        ...cloud
                    ]);
                });
                return () => { unsubP(); unsubC(); unsubS(); unsubCat(); unsubU(); };
            }, [fbUser]);

            const finalizeSale = async (paid, mode, custId) => {
                const totalVal = cart.reduce((a, b) => a + (b.price * b.quantity), 0);
                const costT = cart.reduce((a, b) => a + (b.cost * b.quantity), 0);
                const itemsInSale = [...cart];
                const date = new Date().toISOString().split('T')[0];
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), { total: totalVal, profit: totalVal - costT, date, items: itemsInSale, timestamp: Date.now() });
                    if (custId) {
                        const client = customers.find(c => c.id === custId);
                        if (client?.phoneCel) {
                            const now = new Date();
                            const msg = `🛍️ *TICKET VENTA* 🛍️%0A%0A*Novedades Moritas*%0A--------------------------%0A*Cliente:* ${client.firstName} ${client.lastName1}%0A*Fecha:* ${now.toLocaleDateString()}%0A*Hora:* ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}%0A--------------------------%0A${itemsInSale.map(i => `- ${i.name} (x${i.quantity}): $${(i.price * i.quantity).toFixed(2)}`).join('%0A')}%0A--------------------------%0A*TOTAL: $${totalVal.toFixed(2)} MXN*%0A--------------------------%0A¡Vuelve pronto! ✨`;
                            window.open(`https://wa.me/52${client.phoneCel}?text=${msg}`, '_blank');
                        }
                    }
                    for (const item of itemsInSale) {
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'products', item.id);
                        await updateDoc(ref, { stock: Math.max(0, (item.stock || 0) - item.quantity) });
                    }
                    setCart([]); alert('¡Venta realizada con éxito!');
                } catch (e) { alert("Error al registrar venta"); }
            };

            const openScanner = (cb) => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => { cb(text); setIsScannerOpen(false); scanner.stop(); }, () => {}).catch(() => setIsScannerOpen(false));
                }, 500);
            };

            const handleLogin = (u, p) => { 
                const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pin === p); 
                if (found) { setCurrentUser(found); setView('dashboard'); } else alert('PIN incorrecto'); 
            };

            if (view === 'login') return (
                <div className="min-h-screen bg-gradient-to-br from-purple-700 via-purple-600 to-indigo-800 flex items-center justify-center p-6 text-gray-800">
                    <div className="bg-white/95 backdrop-blur-sm w-full max-w-sm rounded-[3.5rem] p-12 shadow-2xl animate-in fade-in">
                        <div className="flex justify-center mb-8"><div className="bg-purple-100 p-5 rounded-[2rem] text-purple-600 shadow-inner"><Icon name="sparkles" size={48} /></div></div>
                        <h1 className="text-3xl font-black text-center mb-10 tracking-tighter uppercase text-gray-800 text-gray-800 text-gray-800">Novedades Moritas</h1>
                        <div className="space-y-4">
                            <input id="u" placeholder="Usuario" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-2xl outline-none font-black focus:border-purple-200 transition text-gray-800" />
                            <input id="p" type="password" placeholder="PIN" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-2xl outline-none text-center text-4xl font-black tracking-widest focus:border-purple-200 transition text-gray-800" maxLength={8} />
                            <button onClick={() => handleLogin(document.getElementById('u').value, document.getElementById('p').value)} className="w-full bg-purple-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-purple-100 active:scale-95 transition-all text-lg uppercase tracking-widest mt-4 text-gray-800 text-gray-800">Ingresar</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-purple-50 md:flex font-sans text-gray-800 text-gray-800 text-gray-800 text-gray-800">
                    <Navbar view={view} setView={setView} currentUser={currentUser} setCurrentUser={setCurrentUser} />
                    <main className="flex-1 max-w-4xl mx-auto md:p-6 bg-purple-50/50 overflow-y-auto text-gray-800 text-gray-800 text-gray-800 text-gray-800">
                        {view === 'dashboard' && (
                            <div className="p-6 space-y-8 animate-in fade-in text-gray-800">
                                <h1 className="text-4xl font-black tracking-tight text-gray-800">Inicio</h1>
                                <div className="grid grid-cols-2 gap-5 text-gray-800">
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-purple-600 shadow-sm text-gray-800"><p className="text-[10px] font-black text-gray-400 uppercase">Productos</p><p className="text-5xl font-black text-purple-600">{products.length}</p></div>
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-indigo-500 shadow-sm text-gray-800"><p className="text-[10px] font-black text-gray-400 uppercase">Ventas Hoy</p><p className="text-5xl font-black text-indigo-600 text-gray-800">{sales.filter(s => s.date === today).length}</p></div>
                                </div>
                                <button onClick={() => setView('sales')} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-12 rounded-[4rem] flex items-center justify-between shadow-2xl active:scale-95 transition text-gray-800">
                                    <div className="text-left font-black leading-none uppercase text-white"><p className="text-xl opacity-80 mb-1 tracking-widest">Nueva</p><p className="text-5xl italic">VENTA</p></div>
                                    <Icon name="barcode" size={80} className="opacity-90" />
                                </button>
                            </div>
                        )}
                        {view === 'inventory' && <InventoryView products={products} categories={categories} openScanner={openScanner} />}
                        {view === 'sales' && <SalesView products={products} cart={cart} setCart={setCart} addToCart={p => { if(p.stock<=0) return alert('Sin stock'); const ex = cart.find(i=>i.id===p.id); if(ex) setCart(cart.map(i=>i.id===p.id?{...i,quantity:i.quantity+1}:i)); else setCart([...cart,{...p,quantity:1}]); }} customers={customers} finalizeSale={finalizeSale} openScanner={openScanner} />}
                        {view === 'reports' && <ReportsView sales={sales} products={products} />}
                        {view === 'customers' && <CustomersView customers={customers} />}
                        {view === 'users_admin' && <UsersAdminView users={users} />}
                    </main>

                    {isScannerOpen && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-8 backdrop-blur-lg animate-in fade-in">
                            <button onClick={() => setIsScannerOpen(false)} className="absolute top-10 right-10 text-white p-5 active:scale-90 transition"><Icon name="x" size={32} /></button>
                            <div className="w-full max-w-md aspect-square bg-white/5 rounded-[4rem] overflow-hidden border-4 border-purple-500 shadow-2xl" id="reader"></div>
                            <p className="mt-12 text-white font-black uppercase text-center tracking-widest animate-pulse">Escaneando código...</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
