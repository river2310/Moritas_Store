<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades Moritas - Punto de Venta Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Html5-QRCode para escaneo -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f3ff;
            -webkit-tap-highlight-color: transparent;
            color: #1f2937;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .animate-in {
            animation-duration: 300ms;
            animation-fill-mode: both;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation-name: fadeIn; }
        
        @keyframes slideInFromBottom {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-in-from-bottom { animation-name: slideInFromBottom; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Componente de Icono compatible con CDN
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);

            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`} ref={iconRef}></i>;
        };

        // --- COMPONENTES DE VISTA ---

        const Navbar = ({ view, setView, currentUser, setCurrentUser }) => (
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-2 z-40 md:relative md:border-t-0 md:flex-col md:w-64 md:h-screen md:justify-start md:space-y-2 md:p-4 text-gray-800 font-medium shadow-2xl md:shadow-none">
                <div className="hidden md:block mb-8 px-4">
                    <h2 className="text-xl font-black text-purple-600 leading-tight text-gray-800">Novedades<br/>Moritas</h2>
                    <p className="text-xs text-gray-500 mt-1 font-semibold flex items-center">
                        <Icon name="shield-check" size={14} className="mr-1 text-purple-500"/> {currentUser?.name.split(' ')[0]}
                    </p>
                </div>
                
                {[
                    { id: 'dashboard', icon: 'layout-dashboard', label: 'Inicio', roles: ['admin', 'vendedor'] },
                    { id: 'sales', icon: 'barcode', label: 'Vender', roles: ['admin', 'vendedor'] },
                    { id: 'inventory', icon: 'package', label: 'Inventario', roles: ['admin', 'vendedor'] },
                    { id: 'customers', icon: 'users', label: 'Clientes', roles: ['admin'] },
                    { id: 'users_admin', icon: 'user-plus', label: 'Usuarios', roles: ['admin'] },
                    { id: 'reports', icon: 'bar-chart-3', label: 'Reportes', roles: ['admin'] },
                ].map(item => (
                    (item.roles.includes(currentUser?.role)) && (
                        <button 
                            key={item.id}
                            onClick={() => setView(item.id)}
                            className={`flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl transition-all duration-200 ${view === item.id ? 'text-purple-600 bg-purple-50' : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            <Icon name={item.icon} size={24} />
                            <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">{item.label}</span>
                        </button>
                    )
                ))}
                <button 
                    onClick={() => { setView('login'); setCurrentUser(null); }}
                    className="flex flex-col md:flex-row items-center md:space-x-4 p-2 md:px-4 md:py-3 rounded-xl text-red-500 hover:bg-red-50"
                >
                    <Icon name="log-out" size={24} />
                    <span className="text-[10px] md:text-sm font-black mt-1 md:mt-0">Salir</span>
                </button>
            </nav>
        );

        const InventoryView = ({ products, setProducts, categories, setCategories, openScanner }) => {
            const [isAdding, setIsAdding] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [activeCategoryId, setActiveCategoryId] = useState(null);
            const [isAddingQuickCategory, setIsAddingQuickCategory] = useState(false);
            const [newCatName, setNewCatName] = useState('');
            
            const initialForm = { 
                barcode: '', name: '', brand: '', categoryId: '', stock: '',
                cost: '', price: '',
                costo_factura: '', costo_oferta: '', costo_regalo: '',
                precio_especial: '', precio_oferta: '', precio_factura: '' 
            };
            const [form, setForm] = useState(initialForm);

            useEffect(() => {
                if (!activeCategoryId && categories.length > 0) {
                    setActiveCategoryId(categories[0].id);
                }
            }, [categories]);

            const saveProduct = () => {
                if (!form.name || !form.price) return alert('Campos obligatorios: Nombre y Precio');
                const pData = { ...form, cost: parseFloat(form.cost)||0, price: parseFloat(form.price)||0, stock: parseInt(form.stock)||0, categoryId: parseInt(form.categoryId)||0 };
                if (editingId) setProducts(products.map(p => p.id === editingId ? { ...p, ...pData } : p));
                else setProducts([...products, { id: Date.now(), ...pData }]);
                closeForm();
            };

            const closeForm = () => { setIsAdding(false); setEditingId(null); setForm(initialForm); setIsAddingQuickCategory(false); };
            const handleEdit = (p) => { setForm({ ...p }); setEditingId(p.id); setIsAdding(true); };
            const saveQuickCategory = () => {
                if (!newCatName.trim()) return;
                const nid = Date.now();
                setCategories([...categories, { id: nid, name: newCatName.trim() }]);
                setForm({...form, categoryId: nid});
                setNewCatName(''); setIsAddingQuickCategory(false); setActiveCategoryId(nid);
            };

            const filtered = products.filter(p => parseInt(p.categoryId) === activeCategoryId);

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800 animate-in fade-in">
                    <header className="flex justify-between items-center">
                        <h2 className="text-2xl font-black">Inventario</h2>
                        {!isAdding && (
                            <button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg">
                                <Icon name="plus" size={20} className="mr-1" /> Nuevo
                            </button>
                        )}
                    </header>

                    {isAdding && (
                        <div className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-5 animate-in slide-in-from-bottom">
                            <div className="flex justify-between font-black text-purple-700"><h3>{editingId ? 'Editar' : 'Registro'}</h3> <button onClick={closeForm} className="text-gray-400"><Icon name="x" /></button></div>
                            <div className="flex space-x-2">
                                <input placeholder="Código de Barras" className="flex-1 p-4 border-2 border-gray-100 rounded-2xl outline-none" value={form.barcode} onChange={e => setForm({...form, barcode: e.target.value})} />
                                <button onClick={() => openScanner(c => setForm(f => ({...f, barcode: c})))} className="bg-purple-100 text-purple-600 p-4 rounded-2xl"><Icon name="camera" /></button>
                            </div>
                            <input placeholder="Nombre" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-gray-800">
                                <input placeholder="Marca" className="p-4 border-2 border-gray-100 rounded-2xl outline-none" value={form.brand} onChange={e => setForm({...form, brand: e.target.value})} />
                                <div className="space-y-1">
                                    <div className="flex justify-between px-1"><label className="text-[10px] font-black text-gray-400">Categoría</label><button onClick={() => setIsAddingQuickCategory(!isAddingQuickCategory)} className="text-[10px] font-black text-purple-600"> {isAddingQuickCategory ? 'Cerrar' : '+ Nueva'}</button></div>
                                    {!isAddingQuickCategory ? (
                                        <select className="w-full p-4 border-2 border-gray-100 rounded-2xl bg-white" value={form.categoryId} onChange={e => setForm({...form, categoryId: e.target.value})}>
                                            <option value="">Seleccionar...</option>
                                            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    ) : (
                                        <div className="flex space-x-2">
                                            <input autoFocus placeholder="Nombre..." className="flex-1 p-4 border-2 border-purple-100 rounded-2xl outline-none" value={newCatName} onChange={e => setNewCatName(e.target.value)} />
                                            <button onClick={saveQuickCategory} className="bg-purple-600 text-white px-5 rounded-2xl"><Icon name="save" /></button>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3 text-[10px] text-gray-400 font-black text-center">
                                <div><label>COSTO PROMEDIO</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.cost} onChange={e => setForm({...form, cost: e.target.value})} /></div>
                                <div><label>P. VENTA</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.price} onChange={e => setForm({...form, price: e.target.value})} /></div>
                                <div><label>STOCK</label><input type="number" className="w-full p-4 border-2 border-gray-100 rounded-2xl text-center" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} /></div>
                            </div>
                            <button onClick={saveProduct} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest">Guardar</button>
                        </div>
                    )}

                    {!isAdding && (
                        <div className="space-y-4">
                            <div className="flex space-x-2 overflow-x-auto pb-4 no-scrollbar">
                                {categories.map(cat => (
                                    <button key={cat.id} onClick={() => setActiveCategoryId(cat.id)} className={`px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest whitespace-nowrap border-2 ${activeCategoryId === cat.id ? 'bg-purple-600 border-purple-600 text-white shadow-lg' : 'bg-white border-gray-100 text-gray-400'}`}>{cat.name}</button>
                                ))}
                            </div>
                            <div className="space-y-2">
                                {filtered.map(p => (
                                    <div key={p.id} className="bg-white p-5 rounded-[2rem] border border-gray-100 flex justify-between items-center shadow-sm">
                                        <div className="flex-1 min-w-0">
                                            <p className="font-black text-gray-800 text-base">{p.name}</p>
                                            <p className="text-xs text-gray-400 font-bold uppercase mt-0.5">{p.barcode || 'S/C'} • {p.brand}</p>
                                            <div className="mt-3 flex space-x-4 text-xs font-black">
                                                <span className="text-purple-600">${p.price.toFixed(2)}</span>
                                                <span className={`${p.stock < 5 ? 'text-red-500' : 'text-gray-400'}`}>Stock: {p.stock}</span>
                                            </div>
                                        </div>
                                        <div className="flex space-x-2">
                                            <button onClick={() => handleEdit(p)} className="text-purple-400 p-2.5 bg-purple-50 rounded-2xl"><Icon name="edit" size={20}/></button>
                                            <button onClick={() => { if(confirm('¿Borrar?')) setProducts(products.filter(pr => pr.id !== p.id)) }} className="text-red-200 p-2.5 bg-red-50 rounded-2xl"><Icon name="trash-2" size={20}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const CustomersView = ({ customers, setCustomers }) => {
            const [selected, setSelected] = useState(null);
            const [abono, setAbono] = useState('');
            const [isAdding, setIsAdding] = useState(false);
            const [editingId, setEditingId] = useState(null);
            
            const initialForm = { firstName: '', lastName1: '', lastName2: '', phoneCel: '', phoneCasa: '', municipio: '', colonia: '', calle: '', numExt: '', cp: '' };
            const [newCust, setNewCust] = useState(initialForm);

            const saveCustomer = () => {
                if(!newCust.firstName || !newCust.lastName1) return alert('Datos obligatorios');
                if (editingId) setCustomers(customers.map(c => c.id === editingId ? { ...c, ...newCust } : c));
                else setCustomers([...customers, { id: Date.now(), ...newCust, layaways: [] }]);
                setIsAdding(false); setEditingId(null); setNewCust(initialForm);
            };

            const getMapUrl = (c) => `https://maps.google.com/maps?q=${encodeURIComponent(`${c.calle || ''} ${c.numExt || ''}, ${c.colonia || ''}, ${c.municipio || ''}, Mexico`)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800 animate-in fade-in">
                    <header className="flex justify-between items-center text-gray-800">
                        <h2 className="text-2xl font-black">Clientes</h2>
                        {!isAdding && !selected && (
                            <button onClick={() => setIsAdding(true)} className="bg-purple-600 text-white p-2.5 rounded-2xl flex items-center font-black shadow-lg">
                                <Icon name="plus" size={20} className="mr-1" /> Nuevo
                            </button>
                        )}
                    </header>

                    {isAdding && (
                        <div className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-xl space-y-5 animate-in slide-in-from-bottom">
                            <div className="flex justify-between font-black text-purple-700"><h3>{editingId ? 'Editar' : 'Registro'}</h3> <button onClick={() => {setIsAdding(false); setEditingId(null);}}><Icon name="x" /></button></div>
                            <div className="space-y-4 text-gray-800">
                                <input placeholder="Nombre(s)" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.firstName} onChange={e => setNewCust({...newCust, firstName: e.target.value})} />
                                <div className="grid grid-cols-2 gap-2 text-gray-800">
                                    <input placeholder="Ap. Paterno" className="p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.lastName1} onChange={e => setNewCust({...newCust, lastName1: e.target.value})} />
                                    <input placeholder="Ap. Materno" className="p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.lastName2} onChange={e => setNewCust({...newCust, lastName2: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-gray-800">
                                    <input placeholder="Calle" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.calle} onChange={e => setNewCust({...newCust, calle: e.target.value})} />
                                    <input placeholder="Municipio" className="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.municipio} onChange={e => setNewCust({...newCust, municipio: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-gray-800">
                                    <input placeholder="Celular" className="p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.phoneCel} onChange={e => setNewCust({...newCust, phoneCel: e.target.value})} />
                                    <input placeholder="C.P." className="p-4 border-2 border-gray-100 rounded-2xl outline-none" value={newCust.cp} onChange={e => setNewCust({...newCust, cp: e.target.value})} />
                                </div>
                            </div>
                            <button onClick={saveCustomer} className="w-full bg-purple-600 text-white font-black py-5 rounded-3xl uppercase tracking-widest">Guardar</button>
                        </div>
                    )}

                    {selected ? (
                        <div className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-2xl relative animate-in slide-in-from-right">
                            <div className="absolute right-6 top-6 flex space-x-2">
                                <button onClick={() => { setIsAdding(true); setEditingId(selected.id); setNewCust({...selected}); setSelected(null); }} className="bg-purple-100 text-purple-600 p-2 rounded-xl"><Icon name="edit" size={20}/></button>
                                <button onClick={() => setSelected(null)} className="text-gray-400 p-2"><Icon name="x" size={20} /></button>
                            </div>
                            <div className="flex items-center space-x-4 mb-6">
                                <div className="bg-purple-100 p-4 rounded-3xl text-purple-600"><Icon name="user" size={48} /></div>
                                <div><h3 className="font-black text-2xl leading-tight">{selected.firstName} {selected.lastName1}</h3><p className="text-gray-400 font-bold">{selected.phoneCel}</p></div>
                            </div>
                            <div className="mb-6 rounded-3xl overflow-hidden h-44 bg-purple-50"><iframe width="100%" height="100%" frameBorder="0" src={getMapUrl(selected)}></iframe></div>
                            <div className="p-4 bg-gray-50 rounded-2xl border text-sm"><p className="font-bold">{selected.calle}, {selected.municipio}, C.P. {selected.cp}</p></div>
                        </div>
                    ) : (!isAdding && (
                        <div className="space-y-2 text-gray-800">
                            {customers.map(c => (
                                <div key={c.id} className="bg-white p-5 rounded-[2rem] border border-purple-50 flex justify-between items-center shadow-sm">
                                    <button onClick={() => setSelected(c)} className="flex items-center space-x-4 text-left flex-1">
                                        <div className="bg-purple-100 p-2 rounded-2xl text-purple-600"><Icon name="user" size={24} /></div>
                                        <div><p className="font-black text-gray-800 text-base">{c.firstName} {c.lastName1}</p><p className="text-[10px] text-gray-400 font-black uppercase">{c.municipio || 'S/D'}</p></div>
                                    </button>
                                    <div className="flex space-x-2">
                                        <button onClick={() => { setIsAdding(true); setEditingId(c.id); setNewCust({...c}); }} className="p-2 text-purple-300"><Icon name="edit" size={18}/></button>
                                        <button onClick={() => { if(confirm('¿Borrar?')) setCustomers(customers.filter(cu => cu.id !== c.id)) }} className="p-2 text-red-200"><Icon name="trash-2" size={18}/></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            );
        };

        const ReportsView = ({ sales, products }) => {
            const [showDetail, setShowDetail] = useState(false);
            const today = new Date().toISOString().split('T')[0];
            const todaysSales = sales.filter(s => s.date === today);
            const totalVentas = todaysSales.reduce((acc, s) => acc + s.total, 0);
            const totalProfit = todaysSales.reduce((acc, s) => acc + s.profit, 0);

            const productDesglose = todaysSales.reduce((acc, sale) => {
                sale.items.forEach(item => {
                    if (!acc[item.id]) acc[item.id] = { name: item.name, qty: 0, price: item.price, profit: 0 };
                    acc[item.id].qty += item.quantity;
                    acc[item.id].profit += (item.price - item.cost) * item.quantity;
                });
                return acc;
            }, {});

            if (showDetail) return (
                <div className="p-4 space-y-6 pb-24 animate-in slide-in-from-right text-gray-800">
                    <header className="flex items-center space-x-3 mb-4"><button onClick={() => setShowDetail(false)} className="p-3 bg-purple-100 text-purple-600 rounded-2xl"><Icon name="chevron-left" /></button><div><h2 className="text-2xl font-black">Reporte Diario</h2></div></header>
                    <div className="bg-white rounded-[2.5rem] border overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-purple-600 text-white text-[10px] font-black uppercase">
                                <tr><th className="p-5">Producto</th><th className="p-5 text-center">Cant.</th><th className="p-5 text-right">Venta</th><th className="p-5 text-right">Ganancia</th></tr>
                            </thead>
                            <tbody className="text-[11px] font-semibold">
                                {Object.values(productDesglose).map((p, idx) => (
                                    <tr key={idx} className="border-b border-gray-50"><td className="p-5 font-black">{p.name}</td><td className="p-5 text-center">{p.qty}</td><td className="p-5 text-right font-black">${(p.price * p.qty).toFixed(2)}</td><td className="p-5 text-right font-black text-green-600">+${p.profit.toFixed(2)}</td></tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800">
                    <h2 className="text-2xl font-black flex items-center"><Icon name="bar-chart-3" className="mr-2 text-purple-600" /> Reportes de ventas</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onClick={() => setShowDetail(true)} className="bg-purple-600 text-white p-7 rounded-[2.5rem] shadow-xl relative overflow-hidden text-left transition active:scale-95">
                            <Icon name="dollar-sign" size={100} className="absolute -right-4 -bottom-4 opacity-10" />
                            <p className="text-purple-100 font-black text-xs uppercase">Ingresos de Hoy</p>
                            <h3 className="text-4xl font-black mt-2">${totalVentas.toFixed(2)}</h3>
                        </button>
                        <div className="bg-indigo-500 text-white p-7 rounded-[2.5rem] shadow-xl relative overflow-hidden">
                            <Icon name="sparkles" size={100} className="absolute -right-4 -bottom-4 opacity-10" />
                            <p className="text-indigo-100 font-black text-xs uppercase">Utilidad Neta</p>
                            <h3 className="text-4xl font-black mt-2">${totalProfit.toFixed(2)}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const SalesView = ({ products, cart, setCart, addToCart, customers, setCustomers, finalizeSale, openScanner }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [paidWith, setPaidWith] = useState('');
            const [selectedCustId, setSelectedCustId] = useState('');

            const total = cart.reduce((a, b) => a + (b.price * b.quantity), 0);
            const updateQty = (id, n) => {
                const q = parseInt(n); if (isNaN(q) || q < 0) return;
                if (q === 0) setCart(cart.filter(i => i.id !== id));
                else setCart(cart.map(i => i.id === id ? { ...i, quantity: q } : i));
            };

            return (
                <div className="p-4 space-y-6 pb-24 text-gray-800">
                    <h2 className="text-2xl font-black">Registrar Venta</h2>
                    <div className="bg-white p-6 rounded-[2.5rem] shadow-xl border border-purple-50 space-y-5">
                        <button onClick={() => openScanner(c => { const p = products.find(x => x.barcode === c); if(p) addToCart(p); else alert('No registrado'); })} className="w-full bg-purple-50 text-purple-600 p-6 rounded-3xl border-2 border-dashed border-purple-200 flex items-center justify-center font-black active:bg-purple-100 transition"><Icon name="camera" className="mr-2" /> ESCANEAR CÓDIGO</button>
                        <div className="relative"><Icon name="search" className="absolute left-4 top-4 text-gray-400" /><input type="text" placeholder="Buscar producto..." className="w-full pl-12 p-4 bg-gray-50 rounded-2xl outline-none font-bold" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div>
                        {searchTerm && (
                            <div className="bg-white border rounded-2xl shadow-xl max-h-40 overflow-y-auto">
                                {products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => (
                                    <button key={p.id} onClick={() => { addToCart(p); setSearchTerm(''); }} className="w-full p-4 flex justify-between items-center border-b last:border-0 hover:bg-purple-50"><span>{p.name}</span><span className="font-black text-purple-600">${p.price}</span></button>
                                ))}
                            </div>
                        )}
                        <div className="space-y-4 max-h-64 overflow-y-auto border-t border-b py-4 no-scrollbar">
                            {cart.map(i => (
                                <div key={i.id} className="flex flex-col bg-gray-50 p-4 rounded-3xl border border-gray-100">
                                    <div className="flex justify-between font-black text-gray-800"><span>{i.name}</span><span>${(i.price*i.quantity).toFixed(2)}</span></div>
                                    <div className="flex items-center justify-between mt-2">
                                        <p className="text-[10px] text-gray-400 font-black">UNIT: ${i.price}</p>
                                        <div className="flex items-center space-x-2 bg-white rounded-xl border p-1">
                                            <button onClick={() => updateQty(i.id, i.quantity - 1)} className="w-8 h-8 rounded-lg bg-red-50 text-red-500 font-black">-</button>
                                            <input type="number" className="w-10 text-center font-black" value={i.quantity} onChange={e => updateQty(i.id, e.target.value)} />
                                            <button onClick={() => updateQty(i.id, i.quantity + 1)} className="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 font-black">+</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {cart.length === 0 && <p className="text-center text-gray-400 py-10 font-black">Carrito Vacío</p>}
                        </div>
                        <div className="flex justify-between items-center text-gray-800">
                            <span className="text-gray-400 font-black text-[10px] uppercase">Total</span>
                            <p className="text-4xl font-black text-purple-600">${total.toFixed(2)}</p>
                        </div>
                        <div className="space-y-4 text-gray-800">
                            <div className="space-y-1"><label className="text-[10px] font-black text-gray-400 uppercase">¿Con cuánto pagan?</label><input type="number" className="w-full p-5 bg-gray-50 rounded-3xl outline-none font-black text-2xl border-2 focus:border-purple-200" value={paidWith} onChange={e => setPaidWith(e.target.value)} /></div>
                            <select className="w-full p-4 bg-gray-50 rounded-2xl outline-none font-bold text-gray-700" value={selectedCustId} onChange={e => setSelectedCustId(e.target.value)}><option value="">Venta General</option>{customers.map(c => <option key={c.id} value={c.id}>{c.firstName} {c.lastName1}</option>)}</select>
                        </div>
                        <button disabled={cart.length === 0} onClick={() => { finalizeSale(parseFloat(paidWith)||0, 'direct', selectedCustId); setPaidWith(''); }} className="w-full bg-purple-600 text-white font-black py-6 rounded-[3rem] shadow-xl uppercase tracking-widest text-lg disabled:opacity-30">Finalizar Venta</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const scannerCallbackRef = useRef(null);

            const [categories, setCategories] = useState([
                { id: 1, name: 'Perfumería' }, { id: 2, name: 'Papelería' }, { id: 3, name: 'Dulcería' }, { id: 4, name: 'Novedades' }, { id: 5, name: 'Stanhome' }, { id: 6, name: 'Betterware' }, { id: 7, name: 'Fuller' }
            ]);

            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [cart, setCart] = useState([]);
            const [users, setUsers] = useState([
                { id: 1, username: 'admin', pin: '1234', role: 'admin', name: 'Administrador' },
                { id: 2, username: 'fer', pin: '2310', role: 'admin', name: 'Fernando Montoya Rivera' }
            ]);
            const [customers, setCustomers] = useState([
                { id: 1, firstName: 'Fernando', lastName1: 'Montoya', lastName2: 'Rivera', phoneCel: '4442049270', phoneCasa: '', municipio: 'Soledad de Graciano Sánchez', colonia: 'Hacienda Las Margaritas', calle: 'Bugambilia', numExt: '223', cp: '78434', layaways: [] }
            ]);

            const finalizeSale = (paid, mode, custId) => {
                const totalVal = cart.reduce((a, b) => a + (b.price * b.quantity), 0);
                const costT = cart.reduce((a, b) => a + (b.cost * b.quantity), 0);
                const itemsInSale = [...cart];
                const date = new Date().toISOString().split('T')[0];
                
                setSales([...sales, { id: Date.now(), total: totalVal, profit: totalVal - costT, date, items: itemsInSale }]);
                
                if (custId) {
                    const client = customers.find(c => c.id === parseInt(custId));
                    if (client?.phoneCel) {
                        const now = new Date();
                        const msg = `🛍️ *TICKET VENTA* 🛍️%0A%0A*Novedades Moritas*%0A--------------------------%0A*Cliente:* ${client.firstName} ${client.lastName1}%0A*Fecha:* ${now.toLocaleDateString()}%0A*Hora:* ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}%0A--------------------------%0A${itemsInSale.map(i => `- ${i.name} (x${i.quantity}): $${(i.price * i.quantity).toFixed(2)}`).join('%0A')}%0A--------------------------%0A*TOTAL: $${totalVal.toFixed(2)} MXN*%0A--------------------------%0A¡Gracias por su preferencia! ✨`;
                        window.open(`https://wa.me/52${client.phoneCel}?text=${msg}`, '_blank');
                    }
                }

                setProducts(products.map(p => { const item = itemsInSale.find(i => i.id === p.id); return item ? { ...p, stock: p.stock - item.quantity } : p; }));
                setCart([]);
                alert('¡Venta realizada con éxito!');
            };

            const openScanner = (cb) => {
                scannerCallbackRef.current = cb;
                setIsScannerOpen(true);
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                        (text) => { cb(text); setIsScannerOpen(false); scanner.stop(); }, 
                        () => {}
                    ).catch(() => { alert("Error cámara"); setIsScannerOpen(false); });
                }, 500);
            };

            const handleLogin = (u, p) => { 
                const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.pin === p); 
                if (user) { setCurrentUser(user); setView('dashboard'); } else alert('Credenciales incorrectas'); 
            };

            if (view === 'login') return (
                <div className="min-h-screen bg-gradient-to-br from-purple-700 via-purple-600 to-indigo-800 flex items-center justify-center p-6 text-gray-800">
                    <div className="bg-white/95 backdrop-blur-sm w-full max-w-sm rounded-[3.5rem] p-12 shadow-2xl animate-in fade-in">
                        <div className="flex justify-center mb-8"><div className="bg-purple-100 p-5 rounded-[2rem] text-purple-600"><Icon name="sparkles" size={48} /></div></div>
                        <h1 className="text-3xl font-black text-center mb-10 tracking-tighter uppercase">Novedades Moritas</h1>
                        <div className="space-y-4">
                            <input id="u" placeholder="Usuario" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-2xl outline-none font-black focus:border-purple-200 transition" />
                            <input id="p" type="password" placeholder="PIN" className="w-full p-5 bg-gray-50 border-2 border-transparent rounded-2xl outline-none text-center text-4xl font-black tracking-widest focus:border-purple-200 transition" maxLength={4} />
                            <button onClick={() => handleLogin(document.getElementById('u').value, document.getElementById('p').value)} className="w-full bg-purple-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-purple-100 active:scale-95 transition-all text-lg uppercase tracking-widest mt-4">Ingresar</button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-purple-50 md:flex font-sans text-gray-800">
                    <Navbar view={view} setView={setView} currentUser={currentUser} setCurrentUser={setCurrentUser} />
                    <main className="flex-1 max-w-4xl mx-auto md:p-6 bg-purple-50/50 overflow-y-auto text-gray-800">
                        {view === 'dashboard' && (
                            <div className="p-6 space-y-8 animate-in fade-in">
                                <h1 className="text-4xl font-black tracking-tight">Bienvenido</h1>
                                <div className="grid grid-cols-2 gap-5">
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-purple-600 shadow-sm">
                                        <p className="text-[10px] font-black text-gray-400 uppercase">Productos</p>
                                        <p className="text-5xl font-black text-purple-600">{products.length}</p>
                                    </div>
                                    <div className="bg-white p-7 rounded-[3rem] border-b-8 border-b-indigo-500 shadow-sm">
                                        <p className="text-[10px] font-black text-gray-400 uppercase">Ventas Hoy</p>
                                        <p className="text-5xl font-black text-indigo-600">{sales.filter(s => s.date === new Date().toISOString().split('T')[0]).length}</p>
                                    </div>
                                </div>
                                <button onClick={() => setView('sales')} className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-12 rounded-[4rem] flex items-center justify-between shadow-2xl active:scale-95 transition">
                                    <div className="text-left font-black leading-none uppercase"><p className="text-xl opacity-80 mb-1">Nueva</p><p className="text-5xl italic">VENTA</p></div>
                                    <Icon name="barcode" size={80} className="opacity-90" />
                                </button>
                            </div>
                        )}
                        {view === 'inventory' && <InventoryView products={products} setProducts={setProducts} categories={categories} setCategories={setCategories} openScanner={openScanner} />}
                        {view === 'sales' && <SalesView products={products} cart={cart} setCart={setCart} addToCart={p => { if(p.stock<=0) return alert('Sin stock'); const ex = cart.find(i=>i.id===p.id); if(ex) setCart(cart.map(i=>i.id===p.id?{...i,quantity:i.quantity+1}:i)); else setCart([...cart,{...p,quantity:1}]); }} customers={customers} setCustomers={setCustomers} finalizeSale={finalizeSale} openScanner={openScanner} />}
                        {view === 'reports' && <ReportsView sales={sales} products={products} />}
                        {view === 'customers' && <CustomersView customers={customers} setCustomers={setCustomers} />}
                    </main>

                    {isScannerOpen && (
                        <div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-8 backdrop-blur-lg animate-in fade-in">
                            <button onClick={() => setIsScannerOpen(false)} className="absolute top-10 right-10 text-white p-5"><Icon name="x" size={32} /></button>
                            <div className="w-full max-w-md aspect-square bg-white/5 rounded-[4rem] overflow-hidden border-4 border-purple-500 shadow-2xl" id="reader"></div>
                            <p className="mt-12 text-white font-black uppercase text-center">Apunte al código de barras</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
